<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome to Sofia</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}


body {
    margin:0;
    height:100dvh;
    overflow:hidden;
}


/* Welcome background */

#welcome {

    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    background-image:
    linear-gradient(
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.65)
    ),
    url("welcome.jpg");

    background-size:cover;
    background-position:center;

}


/* Card */

.welcome-card {

    width:90%;
    max-width:420px;

    color:white;

    text-align:center;

    padding:35px;

}


.welcome-card h1 {

    color:white;

    font-size:38px;

    line-height:1.15;

    margin-bottom:15px;

}


.welcome-card p {

    font-size:20px;

    margin-bottom:30px;

}


/* Buttons */

.welcome-button {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;

    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.4);

    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);

    color: white;
    text-decoration: none;
}

.welcome-button:link,
.welcome-button:visited {
    color: white;
}

.welcome-button svg {
    flex-shrink: 0;
    stroke: currentColor;
}

.welcome-button:hover {
    background: white;
    color: #222;
}


/* Mobile */

@media(max-width:800px){

    .welcome-card {

        padding:25px;

    }


    .welcome-card h1 {

        font-size:32px;

    }


    .welcome-card p {

        font-size:18px;

    }


    .welcome-button {

        padding:14px;

        font-size:16px;

    }

}


</style>

</head>
